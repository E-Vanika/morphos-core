name: Deploy portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy-vercel:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
      NEXT_PUBLIC_INSTAGRAM_URL: ${{ secrets.NEXT_PUBLIC_INSTAGRAM_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GOOGLE_SHEETS_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEETS_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - name: Deploy application to Vercel
        run: |
          runtime_vars=(
            "GEMINI_API_KEY=$GEMINI_API_KEY"
            "MCP_API_KEY=$MCP_API_KEY"
            "LOG_LEVEL=INFO"
            "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
            "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID"
            "GOOGLE_SHEETS_WEBHOOK_URL=$GOOGLE_SHEETS_WEBHOOK_URL"
            "DOMAIN_PRESET=professional-services"
            "NEXT_PUBLIC_API_URL=/api"
            "NEXT_PUBLIC_INSTAGRAM_URL=$NEXT_PUBLIC_INSTAGRAM_URL"
          )
          build_vars=(
            "NEXT_PUBLIC_API_URL=/api"
            "NEXT_PUBLIC_INSTAGRAM_URL=$NEXT_PUBLIC_INSTAGRAM_URL"
          )
          args=()
          for value in "${runtime_vars[@]}"; do args+=(--env "$value"); done
          for value in "${build_vars[@]}"; do args+=(--build-env "$value"); done
          deploy_site() {
            local project_name="$1"
            local site_kind="$2"
            rm -rf .vercel
            npx vercel deploy --prod --yes --name "$project_name" --token "$VERCEL_TOKEN" "${args[@]}" --env "NEXT_PUBLIC_SITE_KIND=$site_kind" --build-env "NEXT_PUBLIC_SITE_KIND=$site_kind"
          }
          deploy_site crafts-by-vani craft
          deploy_site monika-glamup bridal
